name: Docker Build

# NOTE: this workflow used to trigger only on `release: [published]`, which meant
# it never ran even once.  Releases here are cut by helm/chart-releaser-action in
# release.yml using the default GITHUB_TOKEN, and GitHub deliberately does not
# raise workflow-triggering events for anything that token does -- otherwise a
# workflow could trivially trigger itself forever.  So the release was published,
# no `release` event was ever delivered, and the images had to be built by hand
# with script/build-docker.sh.
#
# The fix is to stop waiting for an event that will never arrive and let
# release.yml call us directly once chart-releaser has cut the release.  The
# other two triggers are conveniences: `workflow_dispatch` replaces the manual
# build script, and `release` still works for a release created by a human (i.e.
# not by GITHUB_TOKEN).

on:
  workflow_call:
    inputs:
      release_version:
        description: "Chart version to tag images with, without a leading v (e.g. 1.7.0)"
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_version:
        description: "Chart version to tag images with, without a leading v (e.g. 1.7.0). Defaults to the version in Chart.yaml."
        required: false
        type: string
  release:
    types: [published]

jobs:
  docker_build:
    strategy:
      # one broken pgpool branch should not stop the others from publishing
      fail-fast: false
      matrix:
        pgpool_version:
          - 4.7.2
          - 4.6.7
          - 4.5.12
          - 4.4.17
          - 4.3.20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Determine release version
        id: vars
        # ${{ }} expressions are substituted into the script before bash parses
        # it, so a release tag or dispatch input like "v$(...)" would execute as
        # shell syntax in a job that holds the Docker Hub push credentials.
        # Everything below therefore arrives through env, where bash treats it
        # as data, and is checked against the shape we expect before use.
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PGPOOL_VERSION: ${{ matrix.pgpool_version }}
        run: |
          set -euo pipefail
          # in order of preference: what our caller told us, what a human typed
          # into the workflow_dispatch form, the tag of a hand-cut release, and
          # finally whatever Chart.yaml says.
          version="${INPUT_VERSION}"
          if [ -z "${version}" ] && [ "${EVENT_NAME}" = "release" ]; then
            version="${RELEASE_TAG}"
          fi
          if [ -z "${version}" ]; then
            version="$(yq eval '.version' charts/pgpool-cloudsql/Chart.yaml)"
          fi
          version="${version#v}"
          if ! printf '%s' "${version}" |
            grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$'; then
            # note: '+' is deliberately not accepted -- it is legal in a semver
            # build-identifier but not in a docker tag
            echo "refusing '${version}' as an image tag component: not a chart version" >&2
            exit 1
          fi
          echo "release_version=${version}" >> "$GITHUB_OUTPUT"
          echo "Tagging images as ${version}-${PGPOOL_VERSION}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: PGPOOL_VERSION=${{ matrix.pgpool_version }}
          pull: true
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/pgpool-cloudsql:${{ steps.vars.outputs.release_version }}-${{ matrix.pgpool_version }}
