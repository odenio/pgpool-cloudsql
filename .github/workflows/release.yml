name: Release Charts

on:
  push:
    branches:
      - main

# Every push to main starts an independent run, so without this two of them can
# both see the version tag as absent, push the same image tags from different
# commits, and race to publish.  Queue instead of cancelling: a half-finished
# release is worse than a slow one.
concurrency:
  group: release-charts
  cancel-in-progress: false

# Ordering matters here. chart-releaser used to run first, which meant a single
# failed matrix leg left a publicly installable chart pointing at image tags
# that were never built -- the ImagePullBackOff this repository already shipped
# once. So: work out the version, build every image the new chart can ask for,
# and only publish the chart once they are all pushed.
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.chart_version.outputs.version }}
      needs_release: ${{ steps.chart_version.outputs.needs_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately NOT chart-releaser's own chart_version output.  That is set
      # from lookup_latest_tag(), which is `git describe --tags HEAD~` evaluated
      # before packaging, so it reports the tag that existed *before* this run:
      # on the merge that releases 1.7.0 it returns v1.6.1.  Upstream:
      # helm/chart-releaser-action#227 and #238, both still open as of v1.7.0
      # (the latest release).
      #
      # Chart.yaml is the real source of truth: cr.yaml releases as
      # "v{{ .Version }}", so the tag chart-releaser will create is this value,
      # and that tag already existing is what tells us there is nothing to do --
      # the same conclusion chart-releaser's own change detection reaches, just
      # early enough that we can order the jobs by it.
      - name: Read the chart version
        id: chart_version
        run: |
          set -euo pipefail
          version="$(yq eval '.version' charts/pgpool-cloudsql/Chart.yaml)"
          # whole-string match: a multiline value would otherwise inject extra
          # assignments into $GITHUB_OUTPUT, where the last one wins
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]; then
            echo "refusing '${version}' from Chart.yaml: not a chart version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released; nothing to do"
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} is not released yet; building images, then releasing"
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi

  # fail-fast is off inside the reusable workflow so that one broken pgpool
  # branch still reports the others, but any failure fails this job, which skips
  # the release below and leaves the chart unpublished.
  docker_build:
    needs: version
    if: needs.version.outputs.needs_release == 'true'
    uses: ./.github/workflows/docker.yaml
    with:
      release_version: ${{ needs.version.outputs.release_version }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

  release:
    needs: [version, docker_build]
    if: needs.version.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          config: cr.yaml
          charts_repo_url: https://odenio.github.io/pgpool-cloudsql
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
