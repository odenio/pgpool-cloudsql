name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      changed_charts: ${{ steps.chart_release.outputs.changed_charts }}
      release_version: ${{ steps.chart_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately NOT chart-releaser's own chart_version output.  That is set
      # from lookup_latest_tag(), which is `git describe --tags HEAD~` evaluated
      # before packaging, so it reports the tag that existed *before* this run:
      # on the merge that releases 1.7.0 it returns v1.6.1, and we would publish
      # images tagged for the previous chart while the new chart asks for tags
      # that were never built.  Upstream: helm/chart-releaser-action#227 and
      # #238, both still open as of v1.7.0 (the latest release).
      #
      # Chart.yaml is the real source of truth: cr.yaml releases as
      # "v{{ .Version }}", so the tag chart-releaser creates is this value.
      - name: Read the chart version
        id: chart_version
        run: |
          set -euo pipefail
          version="$(yq eval '.version' charts/pgpool-cloudsql/Chart.yaml)"
          # whole-string match: a multiline value would otherwise inject extra
          # assignments into $GITHUB_OUTPUT, where the last one wins
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]; then
            echo "refusing '${version}' from Chart.yaml: not a chart version" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Chart version is ${version}"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        id: chart_release
        uses: helm/chart-releaser-action@v1.7.0
        with:
          config: cr.yaml
          charts_repo_url: https://odenio.github.io/pgpool-cloudsql
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  # chart-releaser publishes the release with GITHUB_TOKEN, and GitHub does not
  # deliver workflow-triggering events for that token, so a `release: published`
  # trigger on the docker build never fires.  Call it directly instead.
  docker_build:
    needs: release
    if: needs.release.outputs.changed_charts != ''
    uses: ./.github/workflows/docker.yaml
    with:
      release_version: ${{ needs.release.outputs.release_version }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
