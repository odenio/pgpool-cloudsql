deploy:
  replicaCount: 1
  repository: odentech/pgpool-cloudsql
  tag: ""
  affinity: {}
    # # pin tasks to the default node pool
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #     - matchExpressions:
    #       - key: cloud.google.com/gke-nodepool
    #         operator: In
    #         values:
    #         - default-pool
    # # prefer that tasks are never scheduled
    # # on the same kubernetes node
    # podAntiAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     - labelSelector:
    #         matchExpressions:
    #           - key: "app"
    #             operator: In
    #             values:
    #             - "{{ .Release.Name }}"
    #       topologyKey: "kubernetes.io/hostname"
  tolerations: {}
  annotations: {}
  resources:
    pgpool: {}
      # # pgpool can be a little memory-hungry, especially if you have a large client pool
      # limits:
      #   memory: "2Gi"
      # requests:
      #   memory: "1Gi"
    discovery: {}
    exporter: {}
  podDisruptionBudget:
    maxUnavailable: 1
  service:
    tier: "db"
    additionalLabels: {}
  startupProbe:
    pgpool:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 4
      successThreshold: 1
      failureThreshold: 15
    exporter:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 4
      successThreshold: 1
      failureThreshold: 15
  readinessProbe:
    pgpool:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 4
      successThreshold: 1
      failureThreshold: 2
    exporter:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 4
      successThreshold: 1
      failureThreshold: 2
  livenessProbe:
    pgpool:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 4
      successThreshold: 1
      failureThreshold: 5
    exporter:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 4
      successThreshold: 1
      failureThreshold: 5

discovery:
  # Because Google CloudSQL does not allow for immediate reuse of DB instance names,
  # and encourages a naming scheme of "<name prefix>-<unique id>", pgpool-cloudsql's
  # discovery logic looks for a primary instance where the name prefix portion matches
  # this variable.  IOW if your primary has a name like "metadata-20201130", you would
  # set primaryInstancePrefix to "metadata-".  This is fed as-is to the gcloud
  # `--filter name:${primaryInstancePrefix}` option and MUST match one and only one
  # non-replica instance.
  primaryInstancePrefix: ""  # REQUIRED!
  # If set, replicas that have any of these GCP labels set to "true" will be
  # excluded from pgpool's backend pool. Provide either a single label or a
  # comma-separated list. This is useful for dedicating specific read replicas to
  # other consumers (e.g. analytics) without pgpool load-balancing application
  # traffic to them. The labels must be applied to the CloudSQL instance in GCP.
  replicaSkipLabel: ""
  # The Google Cloud region where discovery logic looks for databases.
  # if "true" it's  the same pod's region,
  # all regions otherwise.
  stayInRegion: true
  # pgpool will itself automatically direct traffic away from backends that are failing
  # health checks, so there is no need to immmediately prune replicas from the config
  # if they are, e.g. briefly not in RUNNABLE state for some reason. If a replica has
  # disappeared from our view, wait at least this many seconds before removing it from
  # the config and forcing a reload
  pruneThreshold: 900

exporter:
  # this username and password is used by the pgpool2_exporter metrics exporter
  # to connect to pgpool.  It can be any valid postgres user known to the backend
  # database instance; we recommend making it a read-only one with limited access.
  postgresUsername: ""  # REQUIRED!
  postgresPassword: ""  # REQUIRED!
  postgresDatabase: "postgres"
  exitOnError: "false"

pcp:
  password: ""

pgpool:
  # what version of pgpool to use!  Currently supported versions are:
  # 4.7.2
  # 4.6.7
  # 4.5.12
  # 4.4.17
  # 4.3.20
  version: "4.5.12"
  # whether to use static or dynamic process management mode; see
  # https://www.pgpool.net/docs/45/en/html/runtime-config-process-management.html
  # allowed values are "static" and "dynamic"
  # WARNING: dynamic process management is only available when using pgpool
  # versions 4.4.0 and above
  processManagementMode: "static"
  # configure scale-in/out strategy when using "dynamic" process management;
  # allowed values are "lazy", "gentle" and "aggressive"
  # (this is ignored if pgpool.processManagementMode is "static"
  processManagementStrategy: "gentle"
  # minimum number of spare child processes to maintain if using dyamic
  # process management mode (ignored when using static mode)
  minSpareChildren: 5
  # maximum number of spare child processes to maintain if using dyamic
  # process management mode (ignored when using static mode)
  maxSpareChildren: 10
  # Number of reserved connections.
  # Pgpool-II does not accept connections if over
  # num_init_children - reserved_connections.
  reservedConnections: 0
  # the hard limit for concurrent incoming connections: when using static process
  # management pgpool will pre-fork exactly this many children. When using dynamic
  # process management, pgpool will try to maintain a pool of child processes that
  # satisfy the values of minSpareChilden and maxSpareChildren but will never go
  # over numInitChildren
  numInitChildren: 32
  # Maximum number of cached backend connections in each pgpool child process.
  # https://www.pgpool.net/docs/42/en/html/runtime-config-connection-pooling.html
  maxPool: 32
  # Pool exits after being idle for this many seconds
  childLifeTime: "5min"
  # Pool exits after receiving that many connections
  # 0 means no exit
  childMaxConnections: 8192
  # Connection to backend closes after being idle for this many seconds
  # 0 means no close
  connectionLifeTime: 0
  # Client is disconnected after being idle for that many seconds
  # (even inside an explicit transactions!)
  # 0 means no disconnection
  clientIdleLimit: 300
  # Ignore leading white spaces of each query
  ignoreLeadingWhiteSpace: "on"
  # Semicolon separated list of query patterns
  # that should be sent to primary node
  # Regexp are accepted
  primaryRoutingQueryPatternList: '.*DO NOT LOAD BALANCE.*'
  # if on, ignore SQL comments when judging if load balance or
  # query cache is possible.
  # If off, SQL comments effectively prevent the judgment
  # (pre 3.4 behavior).
  allowSqlComments: "on"
  # Load balance behavior when write query is issued
  # in an explicit transaction.
  #
  # Valid values:
  #
  # 'transaction' (default):
  #     if a write query is issued, subsequent
  #     read queries will not be load balanced
  #     until the transaction ends.
  #
  # 'trans_transaction':
  #     if a write query is issued, subsequent
  #     read queries in an explicit transaction
  #     will not be load balanced until the session ends.
  #
  # 'dml_adaptive':
  #     Queries on the tables that have already been
  #     modified within the current explicit transaction will
  #     not be load balanced until the end of the transaction.
  #
  # 'always':
  #     if a write query is issued, read queries will
  #     not be load balanced until the session ends.
  #
  # Note that any query not in an explicit transaction
  # is not affected by the parameter except 'always'.
  disableLoadBalanceOnWrite: "transaction"
  # Enables statement level load balancing
  statementLevelLoadBalance: "on"
  # It specifies the load balancing ratio of the primary postgres instance.
  # It can be set to any integer or floating-point value greater than or equal to zero.
  primaryWeight: 0
  # It specifies the load balancing ratio of the replicas.
  # It can be set to any integer or floating-point value greater than or equal to zero.
  # It represents the cumulative weight of the replicas,
  # where the weight of each individual replica is divided by the total number of replicas.
  replicasWeight: 1
  # Controls which minimum message levels are emitted to log. Valid
  # values are DEBUG5, DEBUG4, DEBUG3, DEBUG2, DEBUG1, INFO, NOTICE,
  # WARNING, ERROR, LOG, FATAL, and PANIC. Each level includes all the
  # levels that follow it. The default is WARNING.
  logMinMessages: "ERROR"
  # Controls the amount of detail emitted for each message that is logged.
  # Valid values are TERSE, DEFAULT, and VERBOSE, each adding more fields
  # to displayed messages. TERSE excludes the logging of DETAIL, HINT,
  # QUERY and CONTEXT error information.
  logErrorVerbosity: "TERSE"
  #
  # Streaming replication check config.  REQUIRED.
  srCheckUsername: ""
  srCheckPassword: ""
  srCheckDatabase: "postgres"
  #
  # Health Check config.  REQUIRED
  healthCheckUsername: ""
  healthCheckPassword: ""
  healthCheckDatabase: "postgres"
  # DEPRECATED: use pgpool.coredump.* instead.  If this is set to a non-empty
  # string it still wins, so existing values files keep working unchanged.
  # (fed to `ulimit -c`; defined in blocks or "unlimited")
  coredumpSizeLimit: ""
  # Core dump collection.  Off by default: pgpool drops core files willy-nilly,
  # a single child can dump hundreds of megabytes, and there can be
  # numInitChildren of them, so a crash loop will cheerfully fill a volume.
  #
  # IMPORTANT: this needs one piece of setup OUTSIDE the chart.  Whether a core
  # is written at all, and where, is decided by the node's
  # /proc/sys/kernel/core_pattern -- a kernel-wide setting no pod can change.
  # On GKE it is set per node pool, and `kernel.core_pattern` is on the
  # supported sysctl list, so no privileged DaemonSet is needed:
  #
  #   # node-config.yaml
  #   linuxConfig:
  #     sysctl:
  #       kernel.core_pattern: /var/coredumps/core.%e.%p.%t
  #
  #   gcloud container node-pools update POOL --cluster CLUSTER \
  #     --system-config-from-file=node-config.yaml
  #
  # For a non-pipe pattern the kernel writes the core inside the *crashing
  # process's* mount namespace, so an absolute path lands in this container --
  # which is why GKE accepts absolute paths only, and why `path` below must be
  # the directory part of the pattern you configure.  Get that wrong and the
  # core is written to the container's ephemeral storage and lost on restart.
  #
  # The pgpool container logs the node's core_pattern at startup and tells you
  # which case you are in.  See README.md for the full walkthrough.
  coredump:
    enabled: false
    # fed to `ulimit -c`: a size in 512-byte blocks, or "unlimited"
    sizeLimit: "unlimited"
    # Where the core dump volume is mounted.  This MUST match the directory
    # part of the node pool's kernel.core_pattern (see above), otherwise the
    # kernel writes the core somewhere we have not mounted a volume.
    path: /var/coredumps
    # Once we have captured one complete core, drop RLIMIT_CORE to zero on the
    # running pgpool processes so no further cores are written until the pod
    # restarts.  This bounds disk use by construction, and the first core is
    # the one you want: it has not been perturbed by the earlier crashes.
    # Set to false only if you specifically need to compare several crashes,
    # and then make sure volume.sizeLimit is generous enough.
    stopAfterFirst: true
    volume:
      # If set, mount this existing PersistentVolumeClaim instead of an emptyDir,
      # so cores survive the pod being rescheduled.  Note that an RWO claim will
      # block a rolling update with replicaCount > 1.
      existingClaim: ""
      # Applies to the emptyDir only, and is ignored when existingClaim is set.
      # Note this is a hard Kubernetes limit: exceeding it gets the pod EVICTED,
      # which is why stopAfterFirst is the primary guard rather than this.
      sizeLimit: 4Gi
  # comma-separated list of read-only functions
  # cf: https://www.pgpool.net/docs/latest/en/html/runtime-config-load-balancing.html#GUC-READ-ONLY-FUNCTION-LIST
  readOnlyFunctionList: ""
